<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - KORA STREAM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="icon" type="image/png" href="favicon.png?v=2">
  <link rel="apple-touch-icon" href="favicon.png?v=2">
</head>
<body class="bg-slate-950 text-white min-h-screen font-sans p-4">

<div id="kt-admin-tabs" dir="rtl" class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 px-4 py-3 mb-4">
  <div class="max-w-4xl mx-auto flex flex-wrap items-center justify-between gap-2">
    <div class="flex items-center gap-2 overflow-x-auto">
      <button onclick="ktSwitchTab('matches')" id="kt-tab-matches" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-emerald-500 text-slate-950 whitespace-nowrap">⚽ المباريات</button>
      <button onclick="ktSwitchTab('replays')" id="kt-tab-replays" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-200 hover:bg-slate-700 whitespace-nowrap">🎬 ملخصات وأهداف</button>
    </div>
    <div class="flex items-center gap-2 text-xs">
      <a href="replays.html" target="_blank" class="px-2.5 py-1.5 rounded-lg bg-slate-800 text-amber-400 hover:bg-slate-700">صفحة الملخصات ↗</a>
    </div>
  </div>
</div>

  <div class="max-w-3xl mx-auto space-y-6">
    <!-- Login Box -->
    <section id="login-box" class="max-w-sm mx-auto mt-20 bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
      <h1 class="text-xl font-black text-emerald-400 text-center">لوحة التحكم - KORA STREAM</h1>
      <input id="email" type="email" placeholder="البريد الإلكتروني" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm" />
      <input id="password" type="password" placeholder="كلمة المرور" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm" />
      <button onclick="login()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl font-bold text-sm transition">دخول</button>
      <p id="login-err" class="text-red-400 text-xs text-center hidden"></p>
    </section>

    <!-- Admin Dashboard -->
    <section id="dashboard" class="hidden space-y-5">
      <header class="flex items-center justify-between bg-slate-900 border border-slate-800 p-4 rounded-2xl">
        <h1 class="font-black text-emerald-400">إدارة روابط البث</h1>
        <button onclick="logout()" class="text-xs bg-red-500/20 text-red-400 px-3 py-1.5 rounded-lg">خروج</button>
      </header>

      <div id="matches-container" class="space-y-4"></div>
    </section>
  </div>

  <script>
    const sb = supabase.createClient(
      'https://uwyljkxcfcqmteltjzxu.supabase.co',
      'sb_publishable_5E_ajIPbGSP0Kx9a_LJJXQ_xiG4Jahx'
    );

    let matches = [];

    async function checkAuth() {
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        document.getElementById('login-box').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        loadMatches();
      }
    }

    async function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('login-err');
      errEl.classList.add('hidden');

      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        errEl.textContent = error.message;
        errEl.classList.remove('hidden');
      } else {
        checkAuth();
      }
    }

    async function logout() {
      await sb.auth.signOut();
      location.reload();
    }

    async function loadMatches() {
      const startOfDay = new Date();
      startOfDay.setHours(0, 0, 0, 0);

      const { data, error } = await sb
        .from('matches')
        .select('*')
        .gte('match_time', startOfDay.toISOString())
        .order('match_time', { ascending: true });

      if (error) return alert(error.message);
      matches = data || [];
      renderMatches();
    }

    function renderMatches() {
      const container = document.getElementById('matches-container');
      container.innerHTML = matches.map(m => {
        const servers = Array.isArray(m.servers) ? m.servers : [];
        const timeStr = new Date(m.match_time).toLocaleTimeString('ar-MA', { hour: '2-digit', minute: '2-digit' });

        return `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
              <div class="font-bold text-sm">${m.home_team} <span class="text-emerald-400">vs</span> ${m.away_team}</div>
              <span class="text-xs text-slate-400">${m.league_name} • ${timeStr}</span>
            </div>

            <div class="space-y-1.5">
              ${servers.length ? servers.map((s, idx) => `
                <div class="flex items-center justify-between bg-slate-950 px-3 py-2 rounded-lg text-xs">
                  <div class="truncate ml-2">
                    <span class="text-emerald-400 font-bold">[${s.type}] ${s.name}:</span>
                    <span class="text-slate-400">${s.url}</span>
                  </div>
                  <button onclick="removeServer(${m.id}, ${idx})" class="text-red-400 hover:text-red-300 shrink-0">حذف</button>
                </div>
              `).join('') : '<p class="text-xs text-slate-500">لا توجد سيرفرات بعد</p>'}
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-4 gap-2 pt-2">
              <input id="name-${m.id}" type="text" placeholder="اسم السيرفر (مثلا: HD 1)" class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs" />
              <select id="type-${m.id}" class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs">
                <option value="hls">HLS (.m3u8)</option>
                <option value="iframe">Iframe Embed</option>
              </select>
              <input id="url-${m.id}" type="text" placeholder="رابط البث..." class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs" />
              <button onclick="addServer(${m.id})" class="bg-emerald-600 hover:bg-emerald-500 rounded-lg px-3 py-2 text-xs font-bold">إضافة +</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function addServer(matchId) {
      const m = matches.find(x => x.id === matchId);
      const name = document.getElementById(`name-${matchId}`).value.trim() || 'سيرفر 1';
      const type = document.getElementById(`type-${matchId}`).value;
      const url = document.getElementById(`url-${matchId}`).value.trim();

      if (!url) return alert('لصق رابط البث أولا!');

      const updatedServers = [...(Array.isArray(m.servers) ? m.servers : []), { name, type, url }];
      const { error } = await sb.from('matches').update({ servers: updatedServers }).eq('id', matchId);

      if (error) return alert('خطأ: ' + error.message);
      m.servers = updatedServers;
      renderMatches();
    }

    async function removeServer(matchId, idx) {
      const m = matches.find(x => x.id === matchId);
      const updatedServers = m.servers.filter((_, i) => i !== idx);
      const { error } = await sb.from('matches').update({ servers: updatedServers }).eq('id', matchId);

      if (error) return alert('خطأ: ' + error.message);
      m.servers = updatedServers;
      renderMatches();
    }

    checkAuth();
  </script>



<section id="kt-replays-panel" dir="rtl" class="hidden max-w-4xl mx-auto px-4 pb-12 space-y-5 text-slate-100">
  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
    <h2 class="font-bold text-amber-400 text-sm">➕ إضافة إعادة مباراة أو ملخص أهداف</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
      <input id="kt-rp-title" placeholder="المباراة (مثال: ريال مدريد vs برشلونة)" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" />
      <input id="kt-rp-league" placeholder="البطولة (مثال: الدوري الإسباني)" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" />
      <input id="kt-rp-score" placeholder="النتيجة (مثال: 2 - 1) اختياري" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" />
      <div class="flex gap-2">
        <select id="kt-rp-type" class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
          <option value="highlight">ملخص وأهداف (Highlights)</option>
          <option value="replay">إعادة كاملة (Full Match)</option>
        </select>
        <input id="kt-rp-date" type="date" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" />
      </div>
      <input id="kt-rp-url" placeholder="رابط YouTube أو DaddyLive أو الصق كود iframe كامل" class="sm:col-span-2 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" />
    </div>
    <button onclick="ktAddReplay()" class="px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs">نشر الفيديو</button>
  </div>
  <div id="kt-replays-list" class="space-y-3"></div>
</section>

<script>
(function() {
  var ktSb = (typeof sb !== 'undefined' && sb) ? sb : supabase.createClient('https://uwyljkxcfcqmteltjzxu.supabase.co', 'sb_publishable_5E_ajIPbGSP0Kx9a_LJJXQ_xiG4Jahx');
  var ktMatchEls = [];
  var dateEl = document.getElementById('kt-rp-date');
  if (dateEl) dateEl.value = new Date().toISOString().slice(0, 10);

  function ktCleanUrl(raw) {
    var s = (raw || '').trim();
    var m = s.match(/src=["']([^"']+)["']/i);
    return m ? m[1].trim() : s;
  }

  function ktEsc(s) {
    return String(s || '').replace(/[&<>"']/g, function(m) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
    });
  }

  // Auto-clean pasted <iframe> in ALL inputs across admin.html (Matches + Channels + Replays)
  document.addEventListener('paste', function(e) {
    var el = e.target;
    if (!el || el.tagName !== 'INPUT') return;
    var text = (e.clipboardData || window.clipboardData).getData('text') || '';
    if (text.indexOf('<iframe') !== -1) {
      var cleaned = ktCleanUrl(text);
      if (cleaned) {
        e.preventDefault();
        el.value = cleaned;
        el.dispatchEvent(new Event('input', { bubbles: true }));
      }
    }
  });

  function captureMatchEls() {
    if (ktMatchEls.length) return;
    Array.from(document.body.children).forEach(function(el) {
      if (el.tagName === 'SCRIPT' || el.tagName === 'STYLE') return;
      if (['kt-admin-tabs', 'kt-channels-panel', 'kt-replays-panel'].indexOf(el.id) !== -1) return;
      el.dataset.ktOrigDisplay = el.style.display || '';
      ktMatchEls.push(el);
    });
  }

  window.ktSwitchTab = function(tab) {
    captureMatchEls();
    var chP = document.getElementById('kt-channels-panel');
    var rpP = document.getElementById('kt-replays-panel');
    ['matches', 'channels', 'replays'].forEach(function(t) {
      var b = document.getElementById('kt-tab-' + t);
      if (b) b.className = (t === tab)
        ? 'px-3.5 py-2 rounded-xl text-xs font-bold bg-emerald-500 text-slate-950 whitespace-nowrap'
        : 'px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-200 hover:bg-slate-700 whitespace-nowrap';
    });
    ktMatchEls.forEach(function(el) { el.style.display = (tab === 'matches') ? el.dataset.ktOrigDisplay : 'none'; });
    if (chP) chP.classList.toggle('hidden', tab !== 'channels');
    rpP.classList.toggle('hidden', tab !== 'replays');
    if (tab === 'channels') ktLoadChannels();
    if (tab === 'replays') ktLoadReplays();
  };

  async function ktLoadChannels() {
    var box = document.getElementById('kt-channels-list');
    box.innerHTML = '<div class="text-xs text-slate-400">جاري التحميل...</div>';
    var res = await ktSb.from('channels').select('*').order('sort_order', { ascending: true }).order('id', { ascending: true });
    if (res.error) { box.innerHTML = '<div class="text-xs text-red-400">خطأ: ' + ktEsc(res.error.message) + '</div>'; return; }
    var rows = res.data || [];
    box.innerHTML = rows.map(function(c) {
      return '<div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2.5">' +
        '<div class="flex items-center justify-between gap-2">' +
          '<div class="font-bold text-sm text-white">' + ktEsc(c.name) + ' <span class="text-[11px] font-normal text-slate-400">(' + ktEsc(c.category) + ')</span></div>' +
          '<div class="flex items-center gap-2">' +
            '<label class="text-xs text-slate-300 flex items-center gap-1 cursor-pointer"><input type="checkbox" id="ch-act-' + c.id + '" ' + (c.is_active ? 'checked' : '') + ' /> مفعّلة</label>' +
            '<button onclick="ktDelChannel(' + c.id + ')" class="text-xs px-2.5 py-1 rounded-lg bg-red-500/20 text-red-400 hover:bg-red-500/30">حذف</button>' +
          '</div>' +
        '</div>' +
        '<div class="grid grid-cols-1 sm:grid-cols-2 gap-2">' +
          '<input id="ch-u1-' + c.id + '" value="' + ktEsc(c.stream_url || '') + '" placeholder="السيرفر 1 (الصق رابط أو iframe)" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" />' +
          '<input id="ch-u2-' + c.id + '" value="' + ktEsc(c.backup_url || '') + '" placeholder="السيرفر 2 الاحتياطي" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" />' +
        '</div>' +
        '<button onclick="ktSaveChannel(' + c.id + ', this)" class="px-4 py-1.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs">حفظ الروابط</button>' +
      '</div>';
    }).join('');
  }

  window.ktSaveChannel = async function(id, btn) {
    var u1 = ktCleanUrl(document.getElementById('ch-u1-' + id).value);
    var u2 = ktCleanUrl(document.getElementById('ch-u2-' + id).value);
    var act = document.getElementById('ch-act-' + id).checked;
    document.getElementById('ch-u1-' + id).value = u1;
    document.getElementById('ch-u2-' + id).value = u2;
    btn.textContent = 'جاري الحفظ...';
    var res = await ktSb.from('channels').update({ stream_url: u1, backup_url: u2, is_active: act }).eq('id', id);
    btn.textContent = res.error ? '❌ خطأ' : '✅ تم الحفظ';
    setTimeout(function() { btn.textContent = 'حفظ الروابط'; }, 1500);
  };

  window.ktAddChannel = async function() {
    var name = document.getElementById('kt-ch-name').value.trim();
    if (!name) return alert('اكتب اسم القناة');
    var slug = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '-' + Date.now().toString().slice(-4);
    var res = await ktSb.from('channels').insert({
      name: name,
      slug: slug,
      category: document.getElementById('kt-ch-cat').value,
      stream_url: ktCleanUrl(document.getElementById('kt-ch-url1').value),
      backup_url: ktCleanUrl(document.getElementById('kt-ch-url2').value),
      is_active: true,
      sort_order: 50
    });
    if (res.error) return alert('خطأ: ' + res.error.message);
    document.getElementById('kt-ch-name').value = '';
    document.getElementById('kt-ch-url1').value = '';
    document.getElementById('kt-ch-url2').value = '';
    ktLoadChannels();
  };

  window.ktDelChannel = async function(id) {
    if (!confirm('حذف هاد القناة؟')) return;
    await ktSb.from('channels').delete().eq('id', id);
    ktLoadChannels();
  };

  async function ktLoadReplays() {
    var box = document.getElementById('kt-replays-list');
    box.innerHTML = '<div class="text-xs text-slate-400">جاري التحميل...</div>';
    var res = await ktSb.from('replays').select('*').order('created_at', { ascending: false });
    if (res.error) { box.innerHTML = '<div class="text-xs text-red-400">خطأ: ' + ktEsc(res.error.message) + '</div>'; return; }
    var rows = res.data || [];
    if (!rows.length) { box.innerHTML = '<div class="text-xs text-slate-400">ما كاين حتى فيديو دابا.</div>'; return; }
    box.innerHTML = rows.map(function(r) {
      return '<div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-2">' +
        '<div><div class="font-bold text-sm text-white">' + ktEsc(r.title) + (r.score ? ' (' + ktEsc(r.score) + ')' : '') + '</div>' +
        '<div class="text-xs text-slate-400">' + ktEsc(r.league) + ' • ' + ktEsc(r.match_date) + ' • ' + (r.type === 'highlight' ? 'ملخص' : 'إعادة كاملة') + '</div></div>' +
        '<button onclick="ktDelReplay(' + r.id + ')" class="text-xs px-3 py-1.5 rounded-lg bg-red-500/20 text-red-400 hover:bg-red-500/30 font-bold">حذف</button>' +
      '</div>';
    }).join('');
  }

  window.ktAddReplay = async function() {
    var title = document.getElementById('kt-rp-title').value.trim();
    var url = ktCleanUrl(document.getElementById('kt-rp-url').value);
    if (!title || !url) return alert('عمر عنوان المباراة والرابط');
    var res = await ktSb.from('replays').insert({
      title: title,
      league: document.getElementById('kt-rp-league').value.trim() || 'إعادة مباراة',
      score: document.getElementById('kt-rp-score').value.trim(),
      type: document.getElementById('kt-rp-type').value,
      match_date: document.getElementById('kt-rp-date').value || new Date().toISOString().slice(0, 10),
      video_url: url
    });
    if (res.error) return alert('خطأ: ' + res.error.message);
    document.getElementById('kt-rp-title').value = '';
    document.getElementById('kt-rp-score').value = '';
    document.getElementById('kt-rp-url').value = '';
    ktLoadReplays();
  };

  window.ktDelReplay = async function(id) {
    if (!confirm('حذف هاد الفيديو؟')) return;
    await ktSb.from('replays').delete().eq('id', id);
    ktLoadReplays();
  };
})();
</script>

</body>
</html>
