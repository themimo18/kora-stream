<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - KORA STREAM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- KT-SB-HOOK-START -->
<script>
(function() {
  if (window.supabase && typeof window.supabase.createClient === 'function' && !window.supabase.__ktHooked) {
    var origCreate = window.supabase.createClient.bind(window.supabase);
    window.supabase.createClient = function() {
      var client = origCreate.apply(null, arguments);
      window.__ktAdminSb = client;
      return client;
    };
    window.supabase.__ktHooked = true;
  }
})();
</script>
<!-- KT-SB-HOOK-END -->

<body class="bg-slate-950 text-white min-h-screen font-sans p-4">



  <div class="max-w-3xl mx-auto space-y-6">
    <!-- Login Box -->
    <section id="login-box" class="max-w-sm mx-auto mt-20 bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
      <h1 class="text-xl font-black text-emerald-400 text-center">لوحة التحكم - KORA STREAM</h1>
      <input id="email" type="email" placeholder="البريد الإلكتروني" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm" />
      <input id="password" type="password" placeholder="كلمة المرور" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm" />
      <button onclick="login()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl font-bold text-sm transition">دخول</button>
      <p id="login-err" class="text-red-400 text-xs text-center hidden"></p>
    </section>

    <!-- Admin Dashboard -->
    <section id="dashboard" class="hidden space-y-5">
      <header class="flex items-center justify-between bg-slate-900 border border-slate-800 p-4 rounded-2xl">
        <h1 class="font-black text-emerald-400">إدارة روابط البث</h1>
        <button onclick="logout()" class="text-xs bg-red-500/20 text-red-400 px-3 py-1.5 rounded-lg">خروج</button>
      </header>

      <div id="matches-container" class="space-y-4"></div>
    </section>
  </div>

  <script>
    const sb = supabase.createClient(
      'https://uwyljkxcfcqmteltjzxu.supabase.co',
      'sb_publishable_5E_ajIPbGSP0Kx9a_LJJXQ_xiG4Jahx'
    );

    let matches = [];

    async function checkAuth() {
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        document.getElementById('login-box').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        loadMatches();
      }
    }

    async function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('login-err');
      errEl.classList.add('hidden');

      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        errEl.textContent = error.message;
        errEl.classList.remove('hidden');
      } else {
        checkAuth();
      }
    }

    async function logout() {
      await sb.auth.signOut();
      location.reload();
    }

    async function loadMatches() {
      const startOfDay = new Date();
      startOfDay.setHours(0, 0, 0, 0);

      const { data, error } = await sb
        .from('matches')
        .select('*')
        .gte('match_time', startOfDay.toISOString())
        .order('match_time', { ascending: true });

      if (error) return alert(error.message);
      matches = data || [];
      renderMatches();
    }

    function renderMatches() {
      const container = document.getElementById('matches-container');
      container.innerHTML = matches.map(m => {
        const servers = Array.isArray(m.servers) ? m.servers : [];
        const timeStr = new Date(m.match_time).toLocaleTimeString('ar-MA', { hour: '2-digit', minute: '2-digit' });

        return `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
              <div class="font-bold text-sm">${m.home_team} <span class="text-emerald-400">vs</span> ${m.away_team}</div>
              <span class="text-xs text-slate-400">${m.league_name} • ${timeStr}</span>
            </div>

            <div class="space-y-1.5">
              ${servers.length ? servers.map((s, idx) => `
                <div class="flex items-center justify-between bg-slate-950 px-3 py-2 rounded-lg text-xs">
                  <div class="truncate ml-2">
                    <span class="text-emerald-400 font-bold">[${s.type}] ${s.name}:</span>
                    <span class="text-slate-400">${s.url}</span>
                  </div>
                  <button onclick="removeServer(${m.id}, ${idx})" class="text-red-400 hover:text-red-300 shrink-0">حذف</button>
                </div>
              `).join('') : '<p class="text-xs text-slate-500">لا توجد سيرفرات بعد</p>'}
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-4 gap-2 pt-2">
              <input id="name-${m.id}" type="text" placeholder="اسم السيرفر (مثلا: HD 1)" class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs" />
              <select id="type-${m.id}" class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs">
                <option value="hls">HLS (.m3u8)</option>
                <option value="iframe">Iframe Embed</option>
              </select>
              <input id="url-${m.id}" type="text" placeholder="رابط البث..." class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs" />
              <button onclick="addServer(${m.id})" class="bg-emerald-600 hover:bg-emerald-500 rounded-lg px-3 py-2 text-xs font-bold">إضافة +</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function addServer(matchId) {
      const m = matches.find(x => x.id === matchId);
      const name = document.getElementById(`name-${matchId}`).value.trim() || 'سيرفر 1';
      const type = document.getElementById(`type-${matchId}`).value;
      const url = document.getElementById(`url-${matchId}`).value.trim();

      if (!url) return alert('لصق رابط البث أولا!');

      const updatedServers = [...(Array.isArray(m.servers) ? m.servers : []), { name, type, url }];
      const { error } = await sb.from('matches').update({ servers: updatedServers }).eq('id', matchId);

      if (error) return alert('خطأ: ' + error.message);
      m.servers = updatedServers;
      renderMatches();
    }

    async function removeServer(matchId, idx) {
      const m = matches.find(x => x.id === matchId);
      const updatedServers = m.servers.filter((_, i) => i !== idx);
      const { error } = await sb.from('matches').update({ servers: updatedServers }).eq('id', matchId);

      if (error) return alert('خطأ: ' + error.message);
      m.servers = updatedServers;
      renderMatches();
    }

    checkAuth();
  </script>







<script id="kt-paste-cleaner">
document.addEventListener('paste', function(e) {
  var el = e.target;
  if (!el || el.tagName !== 'INPUT') return;
  var text = (e.clipboardData || window.clipboardData).getData('text') || '';
  var m = text.match(/src=["']([^"']+)["']/i);
  if (text.indexOf('<iframe') !== -1 && m) {
    e.preventDefault();
    el.value = m[1].trim();
    el.dispatchEvent(new Event('input', { bubbles: true }));
  }
});
</script>



<!-- KT-DELETE-MANAGER-START -->
<script>
(function() {
  var sb = window.__ktAdminSb || (window.supabase && window.supabase.createClient('https://uwyljkxcfcqmteltjzxu.supabase.co', 'sb_publishable_5E_ajIPbGSP0Kx9a_LJJXQ_xiG4Jahx'));
  if (!sb) return;

  var STREAM_TABLE = 'streams';
  var rows = [];
  var selectedIds = new Set();
  var drawerOpen = false;
  var isBusy = false;

  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, function(m) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
    });
  }

  function norm(s) {
    return String(s || '').toLowerCase().replace(/[^a-z0-9\u0600-\u06FF]+/g, ' ').trim();
  }

  function getTitle(m) {
    var h = m.home_team || m.team1 || m.team_a || m.home || '';
    var a = m.away_team || m.team2 || m.team_b || m.away || '';
    if (h && a) return h + ' vs ' + a;
    return m.title || m.name || m.match_name || ('مباراة #' + m.id);
  }

  function getMeta(m) {
    return [m.league || m.competition || '', m.match_time || m.time || m.kickoff || '', m.match_date || m.date || ''].filter(Boolean).join(' • ');
  }

  function findLogoutBtn() {
    var btns = document.querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) {
      var t = (btns[i].textContent || '').trim();
      if (t === 'خروج' || t.indexOf('تسجيل الخروج') !== -1) {
        if (btns[i].offsetParent !== null) return btns[i];
      }
    }
    return null;
  }

  function showToast(text, isErr) {
    var el = document.getElementById('kt-del-toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'kt-del-toast';
      el.dir = 'rtl';
      el.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:99999;padding:10px 18px;border-radius:12px;font-size:13px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,0.5);';
      document.body.appendChild(el);
    }
    el.style.background = isErr ? '#7f1d1d' : '#065f46';
    el.style.border = isErr ? '1px solid #ef4444' : '1px solid #10b981';
    el.style.color = '#fff';
    el.textContent = text;
    el.style.display = 'block';
    clearTimeout(el._t);
    el._t = setTimeout(function() { el.style.display = 'none'; }, 3500);
  }

  async function deleteMatchIds(ids, cardEl) {
    if (!ids || !ids.length) return;
    var ok = confirm('واش متأكد بغيتي تمسح ' + (ids.length === 1 ? 'هاد المباراة نهائياً؟' : ids.length + ' مباريات نهائياً؟'));
    if (!ok) return;

    // Delete any attached streams first so foreign keys never block deletion
    try { await sb.from(STREAM_TABLE).delete().in('match_id', ids); } catch (e) {}

    var res = await sb.from('matches').delete().in('id', ids).select();
    if (res.error) {
      showToast('❌ فشل الحذف: ' + res.error.message, true);
      return;
    }
    if (!res.data || !res.data.length) {
      showToast('⚠️ لم يتم الحذف — تأكد من كود SQL ديال الصلاحية فـ Supabase.', true);
      return;
    }

    if (cardEl && cardEl.parentElement) cardEl.remove();
    showToast('✅ تم حذف ' + res.data.length + ' مباراة بنجاح!', false);
    await loadAllMatches();
    if (drawerOpen) renderDrawerList();
  }

  async function loadAllMatches() {
    var res = await sb.from('matches').select('*').order('id', { ascending: false });
    if (!res.error && Array.isArray(res.data)) {
      rows = res.data;
      selectedIds.clear();
    }
  }

  function matchCardToRow(card) {
    // 1. Try finding explicit match ID inside inputs/buttons on the card
    var els = card.querySelectorAll('[data-id],[data-match-id],[onclick],[id]');
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      var candidates = [
        el.getAttribute('data-match-id'),
        el.getAttribute('data-id'),
        (el.getAttribute('onclick') || '').replace(/^[^(]*\(\s*['"]?([0-9a-f-]+)['"]?.*$/i, '$1'),
        (el.id || '').replace(/^[^0-9]*([0-9]+)$/, '$1')
      ];
      for (var c = 0; c < candidates.length; c++) {
        var val = candidates[c];
        if (!val || val === el.getAttribute('onclick') || val === el.id) continue;
        var found = rows.find(function(r) { return String(r.id) === String(val); });
        if (found) return found;
      }
    }

    // 2. Fallback: match by team names shown in card text
    var cardNorm = norm(card.textContent);
    for (var j = 0; j < rows.length; j++) {
      var r = rows[j];
      var h = norm(r.home_team || r.team1 || r.home || '');
      var a = norm(r.away_team || r.team2 || r.away || '');
      if (h && a && cardNorm.indexOf(h) !== -1 && cardNorm.indexOf(a) !== -1) return r;
      var ti = norm(r.title || r.name || '');
      if (ti && cardNorm.indexOf(ti) !== -1) return r;
    }
    return null;
  }

  function injectTopControls(logoutBtn) {
    var headerBar = logoutBtn.closest('div');
    if (!headerBar || document.getElementById('kt-bulk-toggle')) return;

    var btn = document.createElement('button');
    btn.id = 'kt-bulk-toggle';
    btn.type = 'button';
    btn.textContent = '🗑️ حذف المباريات';
    btn.style.cssText = 'padding:6px 12px;border-radius:8px;border:1px solid rgba(239,68,68,0.5);background:rgba(239,68,68,0.18);color:#fca5a5;font-size:12px;font-weight:800;cursor:pointer;margin-inline-start:8px;';
    btn.onclick = async function() {
      drawerOpen = !drawerOpen;
      var drawer = ensureDrawer(headerBar);
      drawer.style.display = drawerOpen ? 'block' : 'none';
      if (drawerOpen) {
        await loadAllMatches();
        renderDrawerList();
      }
    };
    logoutBtn.insertAdjacentElement('afterend', btn);
  }

  function ensureDrawer(headerBar) {
    var drawer = document.getElementById('kt-bulk-drawer');
    if (drawer) return drawer;

    drawer = document.createElement('section');
    drawer.id = 'kt-bulk-drawer';
    drawer.dir = 'rtl';
    drawer.style.cssText = 'display:none;max-width:960px;margin:14px auto;padding:16px;background:#0f172a;border:1px solid rgba(239,68,68,0.4);border-radius:16px;color:#f1f5f9;';
    drawer.innerHTML =
      '<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;">' +
        '<div><strong style="font-size:15px;color:#f87171;">🗑️ إدارة وحذف كل المباريات</strong> <span id="kt-dr-count" style="font-size:12px;color:#94a3b8;margin-right:6px;"></span></div>' +
        '<div style="display:flex;flex-wrap:wrap;gap:6px;">' +
          '<button type="button" id="kt-dr-all" style="padding:6px 10px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#38bdf8;font-size:12px;font-weight:700;cursor:pointer;">☑️ تحديد الكل</button>' +
          '<button type="button" id="kt-dr-del" disabled style="padding:6px 12px;border-radius:8px;border:none;background:#dc2626;color:#fff;font-size:12px;font-weight:900;cursor:pointer;opacity:0.5;">🗑️ حذف المحدد (0)</button>' +
          '<button type="button" id="kt-dr-close" style="padding:6px 10px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#cbd5e1;font-size:12px;font-weight:700;cursor:pointer;">إغلاق ✕</button>' +
        '</div>' +
      '</div>' +
      '<input id="kt-dr-search" type="search" placeholder="ابحث باسم الفريق أو الدوري أو التاريخ..." style="width:100%;box-sizing:border-box;padding:9px 12px;margin-bottom:10px;border-radius:10px;border:1px solid #334155;background:#020617;color:#fff;font-size:13px;outline:none;" />' +
      '<div id="kt-dr-list" style="display:flex;flex-direction:column;gap:7px;max-height:380px;overflow-y:auto;"></div>';

    var host = headerBar.parentElement || document.body;
    headerBar.insertAdjacentElement('afterend', drawer);

    drawer.querySelector('#kt-dr-search').oninput = renderDrawerList;
    drawer.querySelector('#kt-dr-close').onclick = function() {
      drawerOpen = false;
      drawer.style.display = 'none';
    };
    drawer.querySelector('#kt-dr-all').onclick = function() {
      var list = getFilteredRows();
      var allSel = list.length > 0 && list.every(function(m) { return selectedIds.has(String(m.id)); });
      list.forEach(function(m) {
        if (allSel) selectedIds.delete(String(m.id));
        else selectedIds.add(String(m.id));
      });
      renderDrawerList();
    };
    drawer.querySelector('#kt-dr-del').onclick = function() {
      deleteMatchIds(Array.from(selectedIds), null);
    };

    return drawer;
  }

  function getFilteredRows() {
    var inp = document.getElementById('kt-dr-search');
    var q = inp ? (inp.value || '').trim().toLowerCase() : '';
    if (!q) return rows;
    return rows.filter(function(m) {
      return (getTitle(m) + ' ' + getMeta(m)).toLowerCase().indexOf(q) !== -1;
    });
  }

  function renderDrawerList() {
    var listEl = document.getElementById('kt-dr-list');
    var countEl = document.getElementById('kt-dr-count');
    var delBtn = document.getElementById('kt-dr-del');
    if (!listEl) return;

    var list = getFilteredRows();
    if (countEl) countEl.textContent = '(' + rows.length + ' مباراة)';
    if (delBtn) {
      delBtn.textContent = '🗑️ حذف المحدد (' + selectedIds.size + ')';
      delBtn.disabled = selectedIds.size === 0;
      delBtn.style.opacity = selectedIds.size === 0 ? '0.5' : '1';
    }

    if (!list.length) {
      listEl.innerHTML = '<div style="text-align:center;padding:20px;color:#64748b;font-size:12px;">لا توجد مباريات مطابقة.</div>';
      return;
    }

    listEl.innerHTML = list.map(function(m) {
      var idStr = String(m.id);
      var chk = selectedIds.has(idStr) ? 'checked' : '';
      return '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;background:#020617;border:1px solid #1e293b;border-radius:10px;">' +
        '<label style="display:flex;align-items:center;gap:9px;flex:1;min-width:0;cursor:pointer;">' +
          '<input type="checkbox" class="kt-dr-cb" data-id="' + esc(idStr) + '" ' + chk + ' style="width:16px;height:16px;accent-color:#ef4444;cursor:pointer;flex-shrink:0;" />' +
          '<div style="min-width:0;">' +
            '<div style="font-size:13px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + esc(getTitle(m)) + '</div>' +
            '<div style="font-size:11px;color:#94a3b8;">' + esc(getMeta(m) || ('ID: ' + idStr)) + '</div>' +
          '</div>' +
        '</label>' +
        '<button type="button" class="kt-dr-one" data-id="' + esc(idStr) + '" style="padding:5px 11px;border-radius:8px;border:1px solid rgba(239,68,68,0.45);background:rgba(239,68,68,0.16);color:#f87171;font-size:11px;font-weight:800;cursor:pointer;flex-shrink:0;">حذف ✕</button>' +
      '</div>';
    }).join('');

    listEl.querySelectorAll('.kt-dr-cb').forEach(function(cb) {
      cb.onchange = function() {
        var id = cb.getAttribute('data-id');
        if (cb.checked) selectedIds.add(id);
        else selectedIds.delete(id);
        renderDrawerList();
      };
    });
    listEl.querySelectorAll('.kt-dr-one').forEach(function(b) {
      b.onclick = function() { deleteMatchIds([b.getAttribute('data-id')], null); };
    });
  }

  function injectCardDeleteButtons() {
    var addBtns = document.querySelectorAll('button');
    for (var i = 0; i < addBtns.length; i++) {
      var b = addBtns[i];
      if ((b.textContent || '').indexOf('إضافة') === -1 || b.offsetParent === null) continue;

      // Walk up to the match card root (contains "vs" and exactly one "إضافة" button)
      var card = b.parentElement;
      while (card && card !== document.body) {
        var txt = card.textContent || '';
        if (/vs/i.test(txt)) break;
        card = card.parentElement;
      }
      if (!card || card === document.body || card.querySelector('.kt-card-del-btn')) continue;

      var row = matchCardToRow(card);
      if (!row) continue;

      var delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'kt-card-del-btn';
      delBtn.textContent = '🗑️ حذف المباراة';
      delBtn.style.cssText = 'padding:4px 10px;border-radius:8px;border:1px solid rgba(239,68,68,0.45);background:rgba(239,68,68,0.15);color:#f87171;font-size:11px;font-weight:800;cursor:pointer;margin-inline-start:8px;white-space:nowrap;';
      (function(matchId, targetCard) {
        delBtn.onclick = function(e) {
          e.preventDefault();
          e.stopPropagation();
          deleteMatchIds([matchId], targetCard);
        };
      })(row.id, card);

      // Put it right inside the card's top header row
      var topRow = card.firstElementChild;
      if (topRow) topRow.appendChild(delBtn);
      else card.prepend(delBtn);
    }
  }

  async function syncUI() {
    if (isBusy) return;
    var logoutBtn = findLogoutBtn();
    if (!logoutBtn) {
      var oldDrawer = document.getElementById('kt-bulk-drawer');
      if (oldDrawer) oldDrawer.style.display = 'none';
      var oldToggle = document.getElementById('kt-bulk-toggle');
      if (oldToggle) oldToggle.remove();
      drawerOpen = false;
      return;
    }

    isBusy = true;
    try {
      injectTopControls(logoutBtn);
      if (!rows.length) await loadAllMatches();
      injectCardDeleteButtons();
    } finally {
      isBusy = false;
    }
  }

  // Watch for login transition & match cards rendering (zero infinite loop)
  var timer = null;
  var obs = new MutationObserver(function() {
    clearTimeout(timer);
    timer = setTimeout(syncUI, 250);
  });
  obs.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'style'] });

  setTimeout(syncUI, 400);
})();
</script>
<!-- KT-DELETE-MANAGER-END -->
</body>
</html>
