<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - KORA STREAM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="icon" type="image/png" href="favicon.png?v=2">
  <link rel="apple-touch-icon" href="favicon.png?v=2">
</head>
<body class="bg-slate-950 text-white min-h-screen font-sans p-4">



  <div class="max-w-3xl mx-auto space-y-6">
    <!-- Login Box -->
    <section id="login-box" class="max-w-sm mx-auto mt-20 bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
      <h1 class="text-xl font-black text-emerald-400 text-center">لوحة التحكم - KORA STREAM</h1>
      <input id="email" type="email" placeholder="البريد الإلكتروني" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm" />
      <input id="password" type="password" placeholder="كلمة المرور" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm" />
      <button onclick="login()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl font-bold text-sm transition">دخول</button>
      <p id="login-err" class="text-red-400 text-xs text-center hidden"></p>
    </section>

    <!-- Admin Dashboard -->
    <section id="dashboard" class="hidden space-y-5">
      <header class="flex items-center justify-between bg-slate-900 border border-slate-800 p-4 rounded-2xl">
        <h1 class="font-black text-emerald-400">إدارة روابط البث</h1>
        <button onclick="logout()" class="text-xs bg-red-500/20 text-red-400 px-3 py-1.5 rounded-lg">خروج</button>
      </header>

      <div id="matches-container" class="space-y-4"></div>
    </section>
  </div>

  <script>
    const sb = supabase.createClient(
      'https://uwyljkxcfcqmteltjzxu.supabase.co',
      'sb_publishable_5E_ajIPbGSP0Kx9a_LJJXQ_xiG4Jahx'
    );

    let matches = [];

    async function checkAuth() {
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        document.getElementById('login-box').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        loadMatches();
      }
    }

    async function login() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('login-err');
      errEl.classList.add('hidden');

      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        errEl.textContent = error.message;
        errEl.classList.remove('hidden');
      } else {
        checkAuth();
      }
    }

    async function logout() {
      await sb.auth.signOut();
      location.reload();
    }

    async function loadMatches() {
      const startOfDay = new Date();
      startOfDay.setHours(0, 0, 0, 0);

      const { data, error } = await sb
        .from('matches')
        .select('*')
        .gte('match_time', startOfDay.toISOString())
        .order('match_time', { ascending: true });

      if (error) return alert(error.message);
      matches = data || [];
      renderMatches();
    }

    function renderMatches() {
      const container = document.getElementById('matches-container');
      container.innerHTML = matches.map(m => {
        const servers = Array.isArray(m.servers) ? m.servers : [];
        const timeStr = new Date(m.match_time).toLocaleTimeString('ar-MA', { hour: '2-digit', minute: '2-digit' });

        return `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
              <div class="font-bold text-sm">${m.home_team} <span class="text-emerald-400">vs</span> ${m.away_team}</div>
              <span class="text-xs text-slate-400">${m.league_name} • ${timeStr}</span>
            </div>

            <div class="space-y-1.5">
              ${servers.length ? servers.map((s, idx) => `
                <div class="flex items-center justify-between bg-slate-950 px-3 py-2 rounded-lg text-xs">
                  <div class="truncate ml-2">
                    <span class="text-emerald-400 font-bold">[${s.type}] ${s.name}:</span>
                    <span class="text-slate-400">${s.url}</span>
                  </div>
                  <button onclick="removeServer(${m.id}, ${idx})" class="text-red-400 hover:text-red-300 shrink-0">حذف</button>
                </div>
              `).join('') : '<p class="text-xs text-slate-500">لا توجد سيرفرات بعد</p>'}
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-4 gap-2 pt-2">
              <input id="name-${m.id}" type="text" placeholder="اسم السيرفر (مثلا: HD 1)" class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs" />
              <select id="type-${m.id}" class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs">
                <option value="hls">HLS (.m3u8)</option>
                <option value="iframe">Iframe Embed</option>
              </select>
              <input id="url-${m.id}" type="text" placeholder="رابط البث..." class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs" />
              <button onclick="addServer(${m.id})" class="bg-emerald-600 hover:bg-emerald-500 rounded-lg px-3 py-2 text-xs font-bold">إضافة +</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function addServer(matchId) {
      const m = matches.find(x => x.id === matchId);
      const name = document.getElementById(`name-${matchId}`).value.trim() || 'سيرفر 1';
      const type = document.getElementById(`type-${matchId}`).value;
      const url = document.getElementById(`url-${matchId}`).value.trim();

      if (!url) return alert('لصق رابط البث أولا!');

      const updatedServers = [...(Array.isArray(m.servers) ? m.servers : []), { name, type, url }];
      const { error } = await sb.from('matches').update({ servers: updatedServers }).eq('id', matchId);

      if (error) return alert('خطأ: ' + error.message);
      m.servers = updatedServers;
      renderMatches();
    }

    async function removeServer(matchId, idx) {
      const m = matches.find(x => x.id === matchId);
      const updatedServers = m.servers.filter((_, i) => i !== idx);
      const { error } = await sb.from('matches').update({ servers: updatedServers }).eq('id', matchId);

      if (error) return alert('خطأ: ' + error.message);
      m.servers = updatedServers;
      renderMatches();
    }

    checkAuth();
  </script>







<script id="kt-paste-cleaner">
document.addEventListener('paste', function(e) {
  var el = e.target;
  if (!el || el.tagName !== 'INPUT') return;
  var text = (e.clipboardData || window.clipboardData).getData('text') || '';
  var m = text.match(/src=["']([^"']+)["']/i);
  if (text.indexOf('<iframe') !== -1 && m) {
    e.preventDefault();
    el.value = m[1].trim();
    el.dispatchEvent(new Event('input', { bubbles: true }));
  }
});
</script>

<!-- KT-DELETE-MANAGER-START -->
<section id="kt-delete-manager" dir="rtl" style="max-width:900px;margin:24px auto;padding:18px;background:#0f172a;border:1px solid #1e293b;border-radius:16px;color:#f1f5f9;font-family:system-ui,-apple-system,sans-serif;">
  <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;">
    <div>
      <h2 style="margin:0;font-size:18px;font-weight:900;color:#f87171;">🗑️ إدارة وحذف المباريات</h2>
      <p id="kt-del-status" style="margin:4px 0 0;font-size:12px;color:#94a3b8;">جاري تحميل المباريات...</p>
    </div>
    <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;">
      <button type="button" id="kt-del-refresh" style="padding:7px 12px;border-radius:10px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;font-size:12px;font-weight:700;cursor:pointer;">🔄 تحديث</button>
      <button type="button" id="kt-del-select-all" style="padding:7px 12px;border-radius:10px;border:1px solid #334155;background:#1e293b;color:#38bdf8;font-size:12px;font-weight:700;cursor:pointer;">☑️ تحديد الكل</button>
      <button type="button" id="kt-del-selected" disabled style="padding:7px 14px;border-radius:10px;border:none;background:#dc2626;color:#fff;font-size:12px;font-weight:900;cursor:pointer;opacity:0.5;">🗑️ حذف المحدد (0)</button>
    </div>
  </div>

  <input id="kt-del-search" type="search" placeholder="ابحث باسم الفريق أو الدوري..." style="width:100%;box-sizing:border-box;padding:10px 14px;margin-bottom:12px;border-radius:12px;border:1px solid #334155;background:#020617;color:#fff;font-size:13px;outline:none;" />

  <div id="kt-del-msg" style="display:none;margin-bottom:12px;padding:10px 12px;border-radius:10px;font-size:12px;font-weight:700;"></div>
  <div id="kt-del-list" style="display:flex;flex-direction:column;gap:8px;max-height:460px;overflow-y:auto;"></div>
</section>

<script>
(function() {
  var sb = window.supabase.createClient('https://uwyljkxcfcqmteltjzxu.supabase.co', 'sb_publishable_5E_ajIPbGSP0Kx9a_LJJXQ_xiG4Jahx');
  var rows = [];
  var selectedIds = new Set();

  var listEl = document.getElementById('kt-del-list');
  var statusEl = document.getElementById('kt-del-status');
  var msgEl = document.getElementById('kt-del-msg');
  var searchEl = document.getElementById('kt-del-search');
  var btnBulk = document.getElementById('kt-del-selected');
  var btnAll = document.getElementById('kt-del-select-all');
  var btnRef = document.getElementById('kt-del-refresh');

  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, function(m) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
    });
  }

  function showMsg(text, isErr) {
    msgEl.style.display = 'block';
    msgEl.style.background = isErr ? 'rgba(239,68,68,0.18)' : 'rgba(16,185,129,0.18)';
    msgEl.style.border = isErr ? '1px solid rgba(239,68,68,0.45)' : '1px solid rgba(16,185,129,0.45)';
    msgEl.style.color = isErr ? '#fca5a5' : '#6ee7b7';
    msgEl.textContent = text;
  }

  function getTitle(m) {
    var h = m.home_team || m.team1 || m.team_a || m.home || '';
    var a = m.away_team || m.team2 || m.team_b || m.away || '';
    if (h && a) return h + ' 🆚 ' + a;
    return m.title || m.name || m.match_name || ('مباراة #' + m.id);
  }

  function getMeta(m) {
    return [m.league || m.competition || '', m.match_time || m.time || m.kickoff || '', m.match_date || m.date || ''].filter(Boolean).join(' • ');
  }

  function updateBulkBtn() {
    var n = selectedIds.size;
    btnBulk.textContent = '🗑️ حذف المحدد (' + n + ')';
    btnBulk.disabled = n === 0;
    btnBulk.style.opacity = n === 0 ? '0.5' : '1';
  }

  function getFiltered() {
    var q = (searchEl.value || '').trim().toLowerCase();
    if (!q) return rows;
    return rows.filter(function(m) {
      return (getTitle(m) + ' ' + getMeta(m)).toLowerCase().indexOf(q) !== -1;
    });
  }

  function render() {
    var list = getFiltered();
    statusEl.textContent = 'العدد الإجمالي: ' + rows.length + ' مباراة';
    updateBulkBtn();

    if (!list.length) {
      listEl.innerHTML = '<div style="text-align:center;padding:24px;color:#64748b;font-size:13px;">لا توجد مباريات مطابقة حالياً.</div>';
      return;
    }

    listEl.innerHTML = list.map(function(m) {
      var idStr = String(m.id);
      var checked = selectedIds.has(idStr) ? 'checked' : '';
      return '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:#020617;border:1px solid #1e293b;border-radius:12px;">' +
        '<label style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer;">' +
          '<input type="checkbox" class="kt-del-chk" data-id="' + esc(idStr) + '" ' + checked + ' style="width:16px;height:16px;accent-color:#ef4444;cursor:pointer;flex-shrink:0;" />' +
          '<div style="min-width:0;">' +
            '<div style="font-size:13px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + esc(getTitle(m)) + '</div>' +
            '<div style="font-size:11px;color:#94a3b8;margin-top:2px;">' + esc(getMeta(m) || ('ID: ' + idStr)) + '</div>' +
          '</div>' +
        '</label>' +
        '<button type="button" class="kt-del-one" data-id="' + esc(idStr) + '" style="padding:6px 12px;border-radius:8px;border:1px solid rgba(239,68,68,0.45);background:rgba(239,68,68,0.15);color:#f87171;font-size:12px;font-weight:800;cursor:pointer;flex-shrink:0;">حذف ✕</button>' +
      '</div>';
    }).join('');

    listEl.querySelectorAll('.kt-del-chk').forEach(function(cb) {
      cb.onchange = function() {
        var id = cb.getAttribute('data-id');
        if (cb.checked) selectedIds.add(id);
        else selectedIds.delete(id);
        updateBulkBtn();
      };
    });

    listEl.querySelectorAll('.kt-del-one').forEach(function(btn) {
      btn.onclick = function() {
        deleteIds([btn.getAttribute('data-id')]);
      };
    });
  }

  async function loadMatches() {
    statusEl.textContent = 'جاري التحديث...';
    var res = await sb.from('matches').select('*').order('id', { ascending: false });
    if (res.error) {
      showMsg('خطأ في جلب المباريات: ' + res.error.message, true);
      return;
    }
    rows = res.data || [];
    selectedIds.clear();
    render();
  }

  async function deleteIds(ids) {
    if (!ids.length) return;
    var ok = confirm('واش متأكد بغيتي تمسح ' + (ids.length === 1 ? 'هاد المباراة؟' : ids.length + ' مباريات؟'));
    if (!ok) return;

    var res = await sb.from('matches').delete().in('id', ids).select();
    if (res.error) {
      showMsg('❌ فشل الحذف: ' + res.error.message, true);
      return;
    }
    if (!res.data || !res.data.length) {
      showMsg('⚠️ Supabase مانع الحذف (RLS Policy) — دوز كود SQL ديال الصلاحية فـ Supabase SQL Editor وعاود جرّب.', true);
      return;
    }
    showMsg('✅ تم حذف ' + res.data.length + ' مباراة بنجاح!', false);
    await loadMatches();
  }

  searchEl.oninput = render;
  btnRef.onclick = loadMatches;
  btnAll.onclick = function() {
    var list = getFiltered();
    var allChecked = list.length > 0 && list.every(function(m) { return selectedIds.has(String(m.id)); });
    if (allChecked) list.forEach(function(m) { selectedIds.delete(String(m.id)); });
    else list.forEach(function(m) { selectedIds.add(String(m.id)); });
    render();
  };
  btnBulk.onclick = function() { deleteIds(Array.from(selectedIds)); };

  loadMatches();
})();
</script>
<!-- KT-DELETE-MANAGER-END -->
</body>
</html>
